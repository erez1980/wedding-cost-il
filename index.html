<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>כמה עולה חתונה בישראל? | מחשבון חתונה</title><meta name="description" content="מחשבון עלות חתונה בישראל: אולם, אוכל, צילום, מוזיקה, לבוש ועיצוב. תכננו תקציב חתונה אמיתי."><meta name="theme-color" content="#6a284d"><style>:root{--ink:#52203e;--bg:#fff7ef;--card:#fff;--accent:#e35f85;--gold:#d59642;--muted:#76636c}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:1080px;margin:auto;padding:28px 18px 80px}.hero{padding:34px 0;max-width:760px}.tag{color:var(--gold);font-weight:bold}.hero h1{font-size:clamp(2.4rem,7vw,5rem);line-height:1;margin:12px 0}.hero p{font-size:1.2rem;color:var(--muted);line-height:1.7}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:24px}.card{padding:24px;border-radius:24px;background:var(--card);box-shadow:0 12px 35px #54213a15;border:1px solid #f0dce4}h2{margin-top:0}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:bold;font-size:.91rem}input{width:100%;margin-top:7px;padding:13px;border:1px solid #e4d5d9;border-radius:11px;font:inherit;color:var(--ink)}.result{background:var(--ink);color:#fff;border-radius:18px;padding:26px}.result strong{font-size:2.6rem;display:block;color:#ffd39b;margin:8px 0}.result p{color:#ebd8e0;line-height:1.6}.tip{margin-top:18px;background:#ffe9ca;padding:18px;border-radius:14px;line-height:1.6}.stats{display:grid;gap:10px}.stats div{border-bottom:1px solid #eee;padding:11px 0}.stats b{float:left}@media(max-width:700px){.layout,.fields{grid-template-columns:1fr}}</style></head><body><main><section class="hero"><div class="tag">מתכננים בלי להיבהל</div><h1>כמה עולה חתונה בישראל?</h1><p>תכנון תקציב פשוט, ריאלי ושקוף. משנים מספרים, רואים מיד את העלות הכוללת ואת המחיר לאורח.</p></section><section class="layout"><div class="card"><h2>מחשבון תקציב חתונה</h2><div class="fields"><label>מספר אורחים<input id="guests" type="number" value="250"></label><label>מחיר מנה<input id="plate" type="number" value="380"></label><label>צלם<input id="photo" type="number" value="11000"></label><label>מוזיקה / DJ<input id="dj" type="number" value="7000"></label><label>לבוש ואיפור<input id="style" type="number" value="12000"></label><label>עיצוב ותוספות<input id="extra" type="number" value="9000"></label></div></div><aside class="result">התקציב המשוער<strong id="total">₪0</strong><p id="per"></p><div class="tip">טיפ: השאירו 8%–12% כרשת ביטחון לשינויים, ספקים והפתעות.</div></aside></section><section class="card" style="margin-top:24px"><h2>פירוט מהיר</h2><div class="stats"><div>אולם ואוכל <b id="food">₪0</b></div><div>הפקה וספקים <b id="vendors">₪0</b></div><div>עלות בסיסית לאורח <b id="avg">₪0</b></div></div></section></main><script>const ids=['guests','plate','photo','dj','style','extra'];function v(i){return +document.getElementById(i).value||0}function f(x){return '₪'+x.toLocaleString('he-IL')}function calc(){let food=v('guests')*v('plate'),vendors=v('photo')+v('dj')+v('style')+v('extra'),all=food+vendors;total.textContent=f(all);per.textContent='כ־'+f(Math.round(all/Math.max(v('guests'),1)))+' לאורח';food.textContent=f(food);vendors.textContent=f(vendors);avg.textContent=f(Math.round(all/Math.max(v('guests'),1)))}ids.forEach(i=>document.getElementById(i).oninput=calc);calc()</script></body></html>
